<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Projector View</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* High Contrast Colors for Projector */
            --bg-dark: #0f172a;
            --text-light: #f8fafc;
            --accent-primary: #8b5cf6;
            --accent-secondary: #06b6d4;
            --bg-card: rgba(30, 41, 59, 0.8);
            --border-card: rgba(148, 163, 184, 0.2);
            --timer-color: #fca5a5;
            /* Bright red-ish for visibility */
            --gold: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Large Header with Timer */
        .projector-header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 1.5rem 3rem;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 2px solid var(--accent-primary);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .header-left h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-center {
            text-align: center;
        }

        .timer-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 6rem;
            /* VERY LARGE */
            font-weight: 700;
            color: var(--timer-color);
            line-height: 1;
            text-shadow: 0 0 30px rgba(252, 165, 165, 0.4);
        }

        .round-info {
            font-size: 1.5rem;
            color: var(--accent-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 0.5rem;
        }

        .header-right {
            text-align: right;
            font-size: 1.5rem;
            font-weight: 600;
            color: #94a3b8;
        }

        /* Content Area */
        .content-area {
            flex: 1;
            padding: 2rem;
            overflow: hidden;
            position: relative;
        }

        /* View Containers */
        .view-container {
            display: none;
            /* Hidden by default */
            height: 100%;
            width: 100%;
            animation: fadeIn 0.5s ease-out;
        }

        .view-container.active {
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Tables Grid (Round In Progress) */
        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            height: 100%;
            overflow-y: auto;
            padding-bottom: 2rem;
            align-content: start;
        }

        .table-card {
            background: var(--bg-card);
            border: 2px solid var(--border-card);
            border-radius: 1rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .table-header {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-secondary);
            border-bottom: 1px solid var(--border-card);
            padding-bottom: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.25rem;
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 0.5rem;
        }

        .player-name {
            font-weight: 600;
        }

        .player-team {
            font-size: 0.9em;
            opacity: 0.85;
        }

        /* Standings List (Round Complete) */
        .standings-container {
            height: 100%;
            overflow-y: auto;
        }

        .standings-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1.5rem;
        }

        .standings-table th {
            text-align: left;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent-primary);
        }

        .standings-table td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-card);
        }

        .rank-cell {
            font-weight: 800;
            color: var(--accent-secondary);
            width: 80px;
        }

        .score-cell {
            font-weight: 800;
            text-align: right;
        }

        /* Winners View - Horizontal Split Layout */
        .winners-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 1rem 0;
            background: radial-gradient(circle at center, rgba(139, 92, 246, 0.2), transparent);
        }

        .trophy-icon-small {
            font-size: 3rem;
            color: var(--gold);
            filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.5));
            animation: bounce 2s infinite;
        }

        .winner-title-compact {
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* Horizontal Split Layout */
        .winners-layout {
            display: grid;
            grid-template-columns: 1.8fr 1fr;
            gap: 2rem;
            height: calc(100vh - 160px);
            padding: 1.5rem;
            align-items: center;
        }

        /* Champion Panel (Left) */
        .champion-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        /* Runners-up Panel (Right) */
        .runners-up-panel {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            height: 100%;
            justify-content: center;
        }

        /* Notification Overlay */
        .notification-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .notification-overlay.visible {
            opacity: 1;
        }

        .notification-content {
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.5s;
        }

        .notification-overlay.visible .notification-content {
            transform: scale(1);
        }

        .notification-title {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .notification-subtitle {
            font-size: 2rem;
            color: #fff;
        }

        .blink {
            animation: blinker 1s linear infinite;
        }

        @keyframes blinker {
            50% {
                opacity: 0.5;
            }
        }

        /* High Density Layout (16+ tables) */
        .tables-grid.high-density {
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
            padding-bottom: 1rem;
            align-content: start;
        }

        .tables-grid.high-density .table-card {
            padding: 0.5rem;
            border-radius: 0.5rem;
            gap: 0.25rem;
        }

        .tables-grid.high-density .table-header {
            font-size: 1rem;
            margin-bottom: 0.25rem;
            padding-bottom: 0.25rem;
        }

        .tables-grid.high-density .player-row {
            padding: 0.25rem 0.5rem;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.03);
        }

        /* Champion Card - Large and Golden */
        .champion-card {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.3), rgba(245, 158, 11, 0.2));
            border: 3px solid var(--gold);
            border-radius: 1.5rem;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 0 40px rgba(251, 191, 36, 0.5), 0 8px 32px rgba(0, 0, 0, 0.4);
            animation: goldGlow 2s infinite alternate;
            max-width: 700px;
        }

        @keyframes goldGlow {
            0% {
                box-shadow: 0 0 40px rgba(251, 191, 36, 0.5), 0 8px 32px rgba(0, 0, 0, 0.4);
            }

            100% {
                box-shadow: 0 0 60px rgba(251, 191, 36, 0.8), 0 8px 32px rgba(0, 0, 0, 0.4);
            }
        }

        .champion-card .rank-badge {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--gold);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        .champion-card .team-name {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(to right, #fbbf24, #f59e0b, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1.5rem;
            line-height: 1.1;
        }

        /* Finalists Container - Vertical Stack */
        .finalists-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .finalist-card {
            background: var(--bg-card);
            border: 2px solid var(--border-card);
            border-radius: 0.75rem;
            padding: 1rem;
            text-align: center;
        }

        .finalist-card .rank-badge {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent-secondary);
            margin-bottom: 0.4rem;
        }

        .finalist-card .team-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 0.75rem;
            line-height: 1.2;
        }

        /* Score Breakdown Styling with Visual Hierarchy */
        .score-breakdown {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .score-line {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        /* Champion Card Score Sizes */
        .champion-card .score-line.final-score {
            font-size: 2.2rem;
            font-weight: 900;
            color: #fbbf24;
            margin-bottom: 0.5rem;
        }

        .champion-card .score-line.topcut-score {
            font-size: 1.4rem;
            font-weight: 700;
            color: #94a3b8;
        }

        .champion-card .score-line.swiss-score {
            font-size: 1.1rem;
            font-weight: 600;
            color: #64748b;
        }

        /* Finalist Card Score Sizes */
        .finalist-card .score-line.final-score {
            font-size: 1.4rem;
            font-weight: 900;
            color: #fbbf24;
        }

        .finalist-card .score-line.topcut-score {
            font-size: 1rem;
            font-weight: 700;
            color: #94a3b8;
        }

        .finalist-card .score-line.swiss-score {
            font-size: 0.9rem;
            font-weight: 600;
            color: #64748b;
        }

        .score-label {
            font-weight: inherit;
        }

        .score-value {
            font-weight: inherit;
            font-family: 'JetBrains Mono', monospace;
        }

        .score-stars {
            margin-right: 0.25rem;
        }

        /* MVP Section - Compact */
        .mvp-section {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 2px solid var(--border-card);
            text-align: center;
        }

        .mvp-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent-primary);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        .mvp-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
        }

        .mvp-player-name {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #8b5cf6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .mvp-team {
            font-size: 1.2rem;
            color: var(--accent-secondary);
            opacity: 0.8;
        }

        .mvp-score {
            font-size: 1.5rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--gold);
            margin-top: 0.25rem;
        }

        /* Japanese Mode Styling */
        .japanese-mode-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 2px 10px rgba(220, 38, 38, 0.3);
            margin-left: 1rem;
        }

        .japanese-score {
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -0.02em;
        }

        /* Submission Progress Indicator */
        .submission-progress {
            text-align: center;
            margin-top: 0.5rem;
        }

        #projector-progress-text {
            font-size: 1.2rem;
            color: #94a3b8;
            font-weight: 600;
        }

        .progress-bar-mini {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin: 0.4rem auto 0;
            overflow: hidden;
        }

        .progress-bar-mini-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        /* Timer expired pulsing */
        @keyframes timerPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .timer-expired {
            animation: timerPulse 1s ease-in-out infinite;
            color: #ef4444 !important;
        }
    </style>
</head>

<body>

    <header class="projector-header">
        <div class="header-left">
            <h1>MTG Tournament</h1>
        </div>
        <div class="header-center">
            <div id="timerDisplay" class="timer-display">00:00:00</div>
            <div id="roundInfo" class="round-info">Waiting to Start...</div>
            <div class="submission-progress" id="projector-submission-progress" style="display:none;">
                <span id="projector-progress-text">0/0 tables reported</span>
                <div class="progress-bar-mini">
                    <div class="progress-bar-mini-fill" id="projector-progress-fill"></div>
                </div>
            </div>
        </div>
        <div class="header-right">
            <div id="clockDisplay">12:00 PM</div>
        </div>
    </header>

    <main class="content-area">
        <!-- View A: Active Round Table Assignments -->
        <div id="tablesView" class="view-container active">
            <div id="tablesGrid" class="tables-grid">
                <div id="waitingMsg"
                    style="grid-column: 1 / -1; text-align: center; opacity: 0.5; font-size: 2rem; padding-top: 5rem;">
                    Waiting for Pairings...
                </div>
            </div>
        </div>

        <!-- View B: Standings -->
        <div id="standingsView" class="view-container">
            <div class="standings-container">
                <table class="standings-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Team</th>
                            <th style="text-align: right;">Points</th>
                        </tr>
                    </thead>
                    <tbody id="standingsBody">
                        <!-- Populated via JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- View C: Winners -->
        <div id="winnersView" class="view-container">
            <div class="winners-header">
                <i class="fas fa-trophy trophy-icon-small"></i>
                <div class="winner-title-compact">TOURNAMENT CHAMPIONS</div>
            </div>

            <div class="winners-layout">
                <!-- Left Panel: Champion -->
                <div class="champion-panel">
                    <div id="championCard">
                        <!-- Populated via JavaScript -->
                    </div>
                </div>

                <!-- Right Panel: Finalists + MVP -->
                <div class="runners-up-panel">
                    <!-- Finalists (2nd-4th) -->
                    <div id="finalistsContainer" class="finalists-container">
                        <!-- Populated via JavaScript -->
                    </div>

                    <!-- MVP Section -->
                    <div id="mvpSection" class="mvp-section">
                        <div class="mvp-title">TOURNAMENT MVP</div>
                        <div id="mvpContent" class="mvp-content">
                            <!-- Populated via JavaScript -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="notificationOverlay" class="notification-overlay">
        <div class="notification-content">
            <div id="notificationTitle" class="notification-title">ROUND OVER</div>
            <div id="notificationSubtitle" class="notification-subtitle">Please submit results</div>
        </div>
    </div>

    <script>
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        let winnersLoaded = false;

        // CLIENT SIDE TIMER STATE
        let timerState = {
            running: false,
            serverElapsed: 0,
            duration: 3000,
            lastSynced: 0
        };
        let lastRound = 0;
        let lastState = '';

        // Scoring Mode State (synced from server)
        let scoringMode = 'western';  // Default, will be updated from server
        let isJapaneseMode = false;

        // Format score based on scoring mode
        function formatScore(score) {
            if (scoringMode === 'japanese' || isJapaneseMode) {
                return `<span class="japanese-score">${score.toLocaleString()}</span>`;
            }
            return score;
        }

        // Add/remove Japanese mode badge in projector header
        function updateJapaneseModeBadge() {
            const headerLeft = document.querySelector('.header-left h1');
            const existingBadge = document.getElementById('projector-japanese-badge');

            if (isJapaneseMode && !existingBadge && headerLeft) {
                const badge = document.createElement('span');
                badge.id = 'projector-japanese-badge';
                badge.className = 'japanese-mode-badge';
                badge.innerHTML = '🎌 Japanese';
                headerLeft.appendChild(badge);
            } else if (!isJapaneseMode && existingBadge) {
                existingBadge.remove();
            }
        }

        // Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clockDisplay').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // High frequency timer tick (Client Side Estimate) - COUNTDOWN MODE
        setInterval(() => {
            if (timerState.running) {
                const now = Date.now();
                // Calculate elapsed time based on last sync
                const addedTime = (now - timerState.lastSynced) / 1000;
                const estimatedElapsed = Math.floor(timerState.serverElapsed + addedTime);
                // Convert to remaining time (countdown)
                const remaining = Math.max(0, timerState.duration - estimatedElapsed);
                renderTimer(remaining, timerState.duration);
            }
        }, 100); // 10fps update for smooth feel

        function renderTimer(remaining, duration) {
            // Format HH:MM:SS of remaining time
            const h = Math.floor(remaining / 3600).toString().padStart(2, '0');
            const m = Math.floor((remaining % 3600) / 60).toString().padStart(2, '0');
            const s = Math.floor(remaining % 60).toString().padStart(2, '0');

            const timerEl = document.getElementById('timerDisplay');
            timerEl.textContent = `${h}:${m}:${s}`;

            // Visual cues based on remaining time
            if (remaining <= 0) {
                timerEl.textContent = '00:00:00';
                timerEl.style.color = '#ef4444'; // Red
                timerEl.classList.add('timer-expired');
                timerEl.classList.remove('blink');
            } else if (remaining <= duration * 0.1) {
                timerEl.style.color = '#f59e0b'; // Orange when <10% remaining
                timerEl.classList.remove('timer-expired');
                timerEl.classList.remove('blink');
            } else {
                timerEl.style.color = '#fca5a5'; // Default
                timerEl.classList.remove('timer-expired');
                timerEl.classList.remove('blink');
            }
        }

        // Polling Logic
        async function fetchState() {
            try {
                // 1. Fetch Timer State (Lightweight)
                // 1. Fetch Timer State (Lightweight)
                const timerRes = await fetch(`/get_timer?t=${Date.now()}`);
                const timerData = await timerRes.json();

                if (timerData) {
                    // Update client state
                    timerState.running = timerData.running;
                    timerState.serverElapsed = timerData.elapsed;
                    timerState.duration = timerData.duration;
                    timerState.lastSynced = Date.now();

                    // Specific render if stopped (force exact value as countdown)
                    if (!timerState.running) {
                        const remaining = Math.max(0, timerData.duration - timerData.elapsed);
                        renderTimer(remaining, timerData.duration);
                    }
                }

                // 2. Fetch Tournament State
                // 2. Fetch Tournament State
                const stateRes = await fetch(`/get_state_info?t=${Date.now()}`);
                const stateData = await stateRes.json();

                // Sync scoring mode from server
                if (stateData.scoring_mode) {
                    scoringMode = stateData.scoring_mode;
                    isJapaneseMode = stateData.is_japanese_mode || (scoringMode === 'japanese');

                    // Add/remove Japanese mode badge in header
                    updateJapaneseModeBadge();
                }

                // 3. Fetch Round Completion Status (if in progress or setup)
                let roundComplete = false;
                const currentState = stateData.current_state;
                // Check during setup, swiss, top8, or finals in progress
                if (stateData.success && (currentState.includes('in_progress') || currentState === 'tournament_setup')) {
                    const round = stateData.tournament_info.current_round;
                    try {
                        const statusRes = await fetch(`/get_submission_status/${round}?t=${Date.now()}`);
                        if (statusRes.ok) {
                            const statusData = await statusRes.json();
                            if (statusData.success && statusData.progress_percent === 100) {
                                roundComplete = true;
                            }
                            // Update submission progress indicator
                            if (statusData.success) {
                                updateSubmissionProgress(statusData.submitted_count, statusData.total_tables, statusData.progress_percent);
                            }
                        }
                    } catch (e) {
                        // Silent error
                    }
                } else {
                    // Hide progress indicator when not in active round
                    const progressEl = document.getElementById('projector-submission-progress');
                    if (progressEl) progressEl.style.display = 'none';
                }

                if (stateData.success) {
                    handleStateUpdate(stateData, roundComplete);
                }
            } catch (e) {
                // Silent error to avoid console spam
            }
        }

        let displayedRound = 0; // Track which round is currently rendered in DOM
        let tablesLoaded = false; // Track if tables were successfully loaded for current round
        let lastServerState = ''; // Track state changes

        function handleStateUpdate(data, roundComplete) {
            const serverState = data.current_state;
            const round = data.tournament_info.current_round;
            if (typeof updatePollInterval === 'function') updatePollInterval(serverState);

            // Detect state transition - reset tablesLoaded when phase changes
            let stateJustChanged = false;
            const previousServerState = lastServerState;
            if (serverState !== lastServerState) {
                console.log(`[Projector] State changed from ${lastServerState} to ${serverState}`);
                tablesLoaded = false; // Force table re-fetch on state change
                stateJustChanged = true;
                lastServerState = serverState;
            }

            // Update Round Info Text
            let roundText = `Round ${round}`;
            if (serverState.includes('semifinals') || serverState.includes('top8')) roundText = "Semifinals";
            if (serverState.includes('finals')) roundText = "Finals";
            if (serverState === 'finals_complete') roundText = "Tournament Complete";
            document.getElementById('roundInfo').textContent = roundText;

            // State Machine for View Switching

            // Final Winner View
            if (serverState === 'finals_complete') {
                showView('winnersView');
                if (!winnersLoaded) {
                    fetchStandingsForWinner();
                    winnersLoaded = true;
                }
                return;
            } else {
                winnersLoaded = false;
            }

            // Show Standings when:
            // 1. phase just transitioned (swiss→top8, top8→finals) - detect via state change
            // 2. round is complete (all tables submitted) AND we're still in same state (not just transitioned)
            const isPhaseComplete = (
                (previousServerState === 'swiss_in_progress' && serverState !== 'swiss_in_progress') ||
                (previousServerState === 'top8_in_progress' && serverState !== 'top8_in_progress')
            );

            // Skip roundComplete check if state just changed (prevents stale data from blocking new tables)
            if (isPhaseComplete || (roundComplete && !stateJustChanged)) {
                console.log(`[Projector] Showing standings: isPhaseComplete=${isPhaseComplete}, roundComplete=${roundComplete}, stateJustChanged=${stateJustChanged}`);
                showView('standingsView');
                fetchStandings();
                return;
            }

            // Default: Show Tables for current round
            showView('tablesView');

            // Force re-fetch tables if round changed OR if tables weren't successfully loaded yet
            if (round !== displayedRound || !tablesLoaded) {
                console.log(`[Projector] Fetching tables for round ${round} (displayedRound=${displayedRound}, tablesLoaded=${tablesLoaded})`);
                displayedRound = round;
                tablesLoaded = false; // Reset until fetch succeeds
                fetchTables(round);
            }
        }

        function showView(viewId) {
            // Simple optimization: don't re-apply if already active
            const current = document.querySelector('.view-container.active');
            if (current && current.id === viewId) return;

            document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        async function fetchTables(roundNum) {
            try {
                const res = await fetch(`/get_tables/${roundNum}`);
                const data = await res.json();

                if (data.success && data.tables) {
                    if (Object.keys(data.tables).length > 0) {
                        renderTables(data.tables);
                        tablesLoaded = true; // Mark as successfully loaded
                        const waitingMsg = document.getElementById('waitingMsg');
                        if (waitingMsg) waitingMsg.style.display = 'none';
                    }
                }
            } catch (e) { }
        }

        function renderTables(tables) {
            const grid = document.getElementById('tablesGrid');
            const waitingMsg = document.getElementById('waitingMsg');

            // We'll rebuild grid
            // Note: In a heavier app we'd diff-dom, but here it's fine.
            // Check if content changed based on stringify?
            // For now, minimal performance impact for this number of tables.

            grid.innerHTML = '';
            if (waitingMsg) grid.appendChild(waitingMsg);

            // Natural Sort
            const sortedKeys = Object.keys(tables).sort((a, b) => {
                return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
            });

            const tableCount = sortedKeys.length;

            // Toggle High Density Mode
            if (tableCount > 12) {
                grid.classList.add('high-density');
            } else {
                grid.classList.remove('high-density');
            }

            let allCardsHtml = '';
            sortedKeys.forEach(tableName => {
                const players = tables[tableName];
                let playersHtml = '';

                players.forEach(p => {
                    const pName = escapeHtml(p['Player Name'] || p.name || 'Unknown');
                    const pTeam = escapeHtml(p['Team Name'] || p.team || '');

                    playersHtml += `
                        <div class="player-row">
                            <span class="player-name">${pName}</span>
                            <span class="player-team">${pTeam}</span>
                        </div>
                    `;
                });

                allCardsHtml += `
                    <div class="table-card">
                        <div class="table-header">${escapeHtml(tableName)}</div>
                        ${playersHtml}
                    </div>
                `;
            });
            grid.innerHTML += allCardsHtml;
        }

        async function fetchStandings() {
            try {
                const res = await fetch('/standings');
                const data = await res.json();
                if (data.success) {
                    const tbody = document.getElementById('standingsBody');
                    tbody.innerHTML = '';

                    // Check if we're in Top Cut or Finals (show Swiss scores)
                    const isPlayoffPhase = data.current_state &&
                        (data.current_state.includes('top8') ||
                            data.current_state.includes('finals'));

                    data.standings.forEach(team => {
                        // Calculate current phase score (total - swiss)
                        const currentPhaseScore = team.total_points - (team.swiss_points || 0);

                        // Format score display
                        let scoreDisplay = `${team.total_points}`;
                        if (isPlayoffPhase && team.swiss_points > 0) {
                            // Show: "Current Phase pts (Swiss pts)" e.g., "20 (40 Swiss)"
                            scoreDisplay = `${currentPhaseScore} <span style="opacity: 0.6; font-size: 0.8em;">(${team.swiss_points} Swiss)</span>`;
                        }

                        tbody.innerHTML += `
                            <tr>
                                <td class="rank-cell">#${team.rank}</td>
                                <td>${escapeHtml(team.team)}</td>
                                <td class="score-cell">${scoreDisplay}</td>
                            </tr>
                        `;
                    });
                }
            } catch (e) { }
        }

        async function fetchStandingsForWinner() {
            try {
                const res = await fetch('/final_standings');
                const data = await res.json();
                if (data.success && data.final_standings && data.final_standings.length >= 4) {
                    renderTop4AndMVP(data.final_standings, data.mvp);
                }
            } catch (e) {
                console.error('Error fetching final standings:', e);
            }
        }

        function renderTop4AndMVP(finalStandings, mvpData) {
            const championCard = document.getElementById('championCard');
            const finalistsContainer = document.getElementById('finalistsContainer');
            const mvpContent = document.getElementById('mvpContent');

            // Clear existing content
            championCard.innerHTML = '';
            finalistsContainer.innerHTML = '';

            // Render Champion (Rank 1) in left panel
            const champion = finalStandings[0];
            const championElement = createTeamCard(champion, 1, true);
            championCard.appendChild(championElement);

            // Render Finalists (Ranks 2-4) in right panel
            for (let i = 1; i < 4 && i < finalStandings.length; i++) {
                const finalist = finalStandings[i];
                const finalistCard = createTeamCard(finalist, i + 1, false);
                finalistsContainer.appendChild(finalistCard);
            }

            // Render MVP in right panel
            if (mvpData) {
                mvpContent.innerHTML = `
                    <div class="mvp-player-name">${escapeHtml(mvpData.player_name)}</div>
                    <div class="mvp-team">${escapeHtml(mvpData.team_name)}</div>
                    <div class="mvp-score">${mvpData.total_score} Points</div>
                `;
            } else {
                mvpContent.innerHTML = '<div style="opacity: 0.5;">MVP data unavailable</div>';
            }
        }

        function createTeamCard(teamData, rank, isChampion) {
            const card = document.createElement('div');
            card.className = isChampion ? 'champion-card' : 'finalist-card';

            const rankBadge = getRankBadge(rank);
            const scoreBreakdown = createScoreBreakdown(teamData);

            card.innerHTML = `
                <div class="rank-badge">${rankBadge}</div>
                <div class="team-name">${escapeHtml(teamData.team)}</div>
                <div class="score-breakdown">
                    ${scoreBreakdown}
                </div>
            `;

            return card;
        }

        function getRankBadge(rank) {
            switch (rank) {
                case 1: return '🏆 CHAMPION';
                case 2: return '🥈 2nd Place';
                case 3: return '🥉 3rd Place';
                case 4: return '4th Place';
                default: return `${rank}th Place`;
            }
        }

        function createScoreBreakdown(teamData) {
            let html = '';

            // Final Score - MOST IMPORTANT (★★★)
            html += `
                <div class="score-line final-score">
                    <span class="score-stars">★★★</span>
                    <span class="score-label">Final:</span>
                    <span class="score-value">${teamData.final_points} pts</span>
                </div>
            `;

            // Top Cut Score (only if exists) - SECONDARY (★★)
            if (teamData.top8_cut_points > 0) {
                html += `
                    <div class="score-line topcut-score">
                        <span class="score-stars">★★</span>
                        <span class="score-label">Top Cut:</span>
                        <span class="score-value">${teamData.top8_cut_points} pts</span>
                    </div>
                `;
            }

            // Swiss Score - TERTIARY (★)
            html += `
                <div class="score-line swiss-score">
                    <span class="score-stars">★</span>
                    <span class="score-label">Swiss:</span>
                    <span class="score-value">${teamData.swiss_points} pts</span>
                </div>
            `;

            // Total Score REMOVED per user request

            return html;
        }

        // Submission Progress Indicator Update
        function updateSubmissionProgress(submitted, total, percent) {
            const progressEl = document.getElementById('projector-submission-progress');
            const textEl = document.getElementById('projector-progress-text');
            const fillEl = document.getElementById('projector-progress-fill');

            if (!progressEl || !textEl || !fillEl) return;

            if (total > 0) {
                progressEl.style.display = 'block';
                textEl.textContent = `${submitted}/${total} tables reported`;
                fillEl.style.width = `${percent}%`;
            } else {
                progressEl.style.display = 'none';
            }
        }

        // Adaptive polling: 2s during active play, 5s when idle/complete
        let pollInterval = 2000;
        let pollTimerId = null;
        function schedulePoll() {
            if (pollTimerId) clearTimeout(pollTimerId);
            pollTimerId = setTimeout(() => {
                fetchState().then(() => schedulePoll());
            }, pollInterval);
        }
        function updatePollInterval(state) {
            if (state === 'finals_complete' || state === 'initial') {
                pollInterval = 10000;
            } else if (timerState.running) {
                pollInterval = 2000;
            } else {
                pollInterval = 5000;
            }
        }
        fetchState().then(() => schedulePoll());

    </script>
