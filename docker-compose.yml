version: '3.8'

services:
  mtg-tournament-dashboard:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount Excel file so it can be easily updated
      - ./participants:/app/participants
      # Mount backup directory to persist tournament state across container restarts
      - ./tournament_backups:/app/tournament_backups
    restart: unless-stopped
    container_name: mtg-tournament-dashboard

    # Optional: Add resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
